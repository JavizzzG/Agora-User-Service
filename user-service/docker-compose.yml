services:
  # PostgreSQL Database
  postgres:
    image: postgres:18.2-alpine
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - user-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Service Application
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTH_SERVICE_CREDENTIALS_ENDPOINT: ${AUTH_SERVICE_CREDENTIALS_ENDPOINT}
      AUTH_SERVICE_CREDENTIALS: ${AUTH_SERVICE_CREDENTIALS}
      AUTH_SERVICE_AUTHENTICATE_SERVICE: ${AUTH_SERVICE_AUTHENTICATE_SERVICE}
      AUTH_SERVICE_RETRY_MAX_ATTEMPTS: ${AUTH_SERVICE_RETRY_MAX_ATTEMPTS}
      AUTH_SERVICE_RETRY_INITIAL_DELAY_MS: ${AUTH_SERVICE_RETRY_INITIAL_DELAY_MS}
      AUTH_SERVICE_RETRY_MAX_DELAY_MS: ${AUTH_SERVICE_RETRY_MAX_DELAY_MS}
      AUTH_SERVICE_RETRY_MULTIPLIER: ${AUTH_SERVICE_RETRY_MULTIPLIER}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
    ports:
      - "${SERVER_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user-service-network
      - agora-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  user-service-network:
    driver: bridge

  agora-network:
    external: true
    name: agora-network
